<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070707" />
    <meta name="description" content="Alle veröffentlichten Versionen von Pilot, dem Sprach-Assistenten." />
    <link rel="canonical" href="__ORIGIN__/versionen/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Pilot – Versionen</title>
    <style>
      :root { color: #f2f2ef; background: #070707; color-scheme: only dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #070707; }
      a { color: inherit; }
      main { max-width: 46rem; margin: 0 auto; padding: 2.5rem 16px 4rem; }
      header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2.5rem; }
      header a { text-decoration: none; font-weight: 640; }
      header nav a { color: #9b9da3; font-weight: 400; font-size: 0.85rem; }
      h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); letter-spacing: -0.03em; margin: 0 0 0.5rem; }
      .lead { color: #9b9da3; margin: 0 0 2rem; line-height: 1.6; }
      article { border: 1px solid rgba(242, 242, 239, 0.08); border-radius: 0.9rem;
        background: rgba(242, 242, 239, 0.025); padding: 1.2rem 1.4rem; margin-bottom: 1rem; scroll-margin-top: 1.5rem; }
      article:target { border-color: #a9b9ff; }
      h2 { font-size: 1.05rem; margin: 0 0 0.35rem; }
      .meta { color: #777b82; font-size: 0.8rem; margin: 0 0 0.75rem; }
      .notes { color: #c9cace; font-size: 0.9rem; line-height: 1.6; white-space: pre-wrap; margin: 0; }
      .empty { color: #777b82; }
      footer { color: #777b82; font-size: 0.8rem; text-align: center; padding: 2rem 16px; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <a href="/">Pilot</a>
        <nav><a href="/#download">Download</a></nav>
      </header>
      <h1>Versionen</h1>
      <p class="lead">Jede veröffentlichte Version von Pilot. Installierte Apps aktualisieren sich selbst auf die aktuelle Version.</p>
      <div id="versions"><p class="empty">Wird geladen …</p></div>
      <noscript><p class="empty">Die Liste braucht JavaScript: <a href="/release/hex/history.json">history.json</a></p></noscript>
    </main>
    <footer>Pilot basiert auf <a href="https://github.com/anomalyco/hex">Hex</a> (MIT-Lizenz, <a href="/LICENSE.txt">Lizenztext</a>).</footer>
    <script>
      const NAMES = {
        "macos-arm64-dmg": "macOS", "windows-x64-setup": "Windows x64", "windows-arm64-setup": "Windows ARM64",
        "linux-x64": "Linux x64", "linux-arm64": "Linux ARM64",
      }
      const list = document.getElementById("versions")
      const date = (text) => new Date(text).toLocaleDateString("de-DE", { day: "numeric", month: "long", year: "numeric" })
      fetch("/release/hex/history.json", { cache: "no-cache" })
        .then((response) => (response.ok ? response.json() : { versions: [] }))
        .then(({ versions }) => {
          list.replaceChildren()
          if (!versions.length) {
            list.innerHTML = '<p class="empty">Noch keine Version veröffentlicht.</p>'
            return
          }
          for (const entry of versions) {
            const article = document.createElement("article")
            article.id = entry.version
            const title = document.createElement("h2")
            title.textContent = `Pilot ${entry.version}`
            const meta = document.createElement("p")
            meta.className = "meta"
            const platforms = entry.targets.map((target) => NAMES[target]).filter(Boolean)
            meta.textContent = [date(entry.published_at), entry.channel !== "stable" ? `Kanal ${entry.channel}` : "", platforms.join(", ")]
              .filter(Boolean).join(" · ")
            article.append(title, meta)
            if (entry.notes) {
              const notes = document.createElement("p")
              notes.className = "notes"
              notes.textContent = entry.notes
              article.append(notes)
            }
            list.append(article)
          }
          if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView()
        })
        .catch(() => { list.innerHTML = '<p class="empty">Die Versionen konnten nicht geladen werden.</p>' })
    </script>
  </body>
</html>
