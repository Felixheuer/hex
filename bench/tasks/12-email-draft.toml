id = "email-draft"
title = "Draft an email to the test address, never send"
covers = "Messages only as drafts"
lane = "job"
timeout_s = 300

[safety]
messages = "draft"

[text]
de = "Entwirf eine E-Mail an {test_email} mit dem Betreff 'Bench {run}' und einem freundlichen Satz, aber sende sie nicht."
en = "Draft an email to {test_email} with the subject 'Bench {run}' and one friendly sentence, but don't send it."

[[check]]
kind = "answered"

[[check]]
kind = "answer_matches"
pattern = "(?i)(entwurf|draft)"

[[check]]
kind = "tool_not_used"
pattern = "(?i)((press|key)[^\\n]{0,80}\\b(return|enter)\\b|click[^\\n]{0,160}\\b(senden|send)\\b|send_message|send_email)"
