id = "ocr-window"
title = "Read a window as text (OCR)"
covers = "G. Read a Citrix window as text"
lane = "any"
timeout_s = 120

[[precondition]]
kind = "app_running"
app = "{ocr_app}"

[text]
de = "Lies mir vor, was im Fenster von {ocr_app} steht."
en = "Read me what the {ocr_app} window says."

[[check]]
kind = "answered"

[[check]]
kind = "answer_matches"
pattern = "{ocr_marker_re}"

[[check]]
kind = "tool_not_used"
pattern = "(?i)(desktop_click|desktop_type|press_key|key_combo|close_app|quit_app)"
