id = "running-apps"
title = "Which apps run (reads the desktop, touches nothing)"
covers = "B. Knowing everything"
lane = "quick"
timeout_s = 60

[text]
de = "Welche Apps laufen gerade bei mir?"
en = "Which apps are running on my Mac right now?"

[[check]]
kind = "answered"

[[check]]
kind = "answer_matches"
pattern = "(?i)finder"

[[check]]
kind = "max_steps"
steps = 4

[[check]]
kind = "tool_not_used"
pattern = "(?i)(desktop_click|desktop_type|press_key|key_combo|close_app|quit_app)"
