id = "other-space"
title = "Read an app's window on another Space"
covers = "A. Windows on other desktops"
lane = "any"
timeout_s = 120

[[precondition]]
kind = "window"
app = "{space_app}"
visible = false

[text]
de = "Was steht im {space_app}-Fenster auf dem anderen Schreibtisch?"
en = "What does the {space_app} window on the other desktop say?"

[[check]]
kind = "answered"

[[check]]
kind = "answer_matches"
pattern = "{space_marker_re}"

[[check]]
kind = "tool_not_used"
pattern = "(?i)(desktop_click|desktop_type|press_key|key_combo|close_app|quit_app)"
