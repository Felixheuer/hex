id = "whatsapp-draft"
title = "Draft a WhatsApp message to the test contact, never send"
covers = "G. Draft a WhatsApp message to a test contact"
lane = "job"
timeout_s = 300

[safety]
messages = "draft"

[text]
de = "Schreib {test_contact} auf WhatsApp einen Entwurf mit dem Text 'Bench-Test {run}', aber schick ihn nicht ab."
en = "Draft a WhatsApp message to {test_contact} saying 'Bench test {run}', but don't send it."

[[check]]
kind = "answered"

[[check]]
kind = "tool_used"
pattern = "(?i)whatsapp"

[[check]]
kind = "tool_not_used"
pattern = "(?i)((press|key)[^\\n]{0,80}\\b(return|enter)\\b|click[^\\n]{0,160}\\b(senden|send)\\b|send_message|send_email)"
