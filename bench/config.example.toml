# Copy to bench/config.toml (not committed) and fill in what your Mac holds.
# A task whose placeholder has no value here is skipped, never guessed.
# `hex bench run --dry-run` uses these sample values when config.toml is missing.
# Keys ending in `_re` are regular expressions (checks use them as they are);
# every other value is matched literally.

# Message recipients: ONLY test recipients you own. Messages are drafts and
# are never sent; the tasks say so and a check fails any send.
test_contact = "Hex Bench"              # a WhatsApp contact that is you (a second number, or a group with only you)
test_email = "bench-test@example.invalid"

# Reading tasks: something only the right window can answer.
calendar_hint = "Bench-Termin"           # a calendar event's title
calendar_when_re = "(?i)(montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag|monday|tuesday|wednesday|thursday|friday|saturday|sunday|\\d{1,2}[.:]\\d{2})"
chrome_hint = "Wikipedia"                # words of a tab title in your own Chrome
chrome_marker_re = "(?i)wikipedia"          # what its answer must mention
ocr_app = "Citrix Viewer"                # an app whose window is only readable as pixels
ocr_marker_re = "(?i)\\w{4,}"               # a word you know is in that window
space_app = "TextEdit"                   # an app with a window parked on another Space
space_marker_re = "(?i)bench"               # a word in that window
