[land]
branch = "dev"
batch_max = 4
verify = [
  "cargo test --locked --workspace --lib",
  "[ -d sdk/node_modules ] || (cd sdk && bun install --frozen-lockfile)",
  "AGENT_DESK_TEAM_ID=${AGENT_DESK_TEAM_ID:-QC99C9JE59} AGENT_DESK_CAPTURE=1 AGENT_DESK_LOCAL_BUILD=1 scripts/build-app.sh",
]

[land.app]
target = "/Applications/Agent-Desk.app"
bundle = "target/app/Agent-Desk.app"
id = "fheuer.agentdesk"
exe = "hex"
wait_idle = 30
install_cmd = "if [ -x \"$HOME/Library/Caches/hex-install/install-gate.sh\" ]; then while [ \"$(\"$HOME/Library/Caches/hex-install/install-gate.sh\")\" != ready ]; do sleep 5; done; fi && if [ -f \"$HOME/code/home/tools/hex-autobuild/install.py\" ]; then python3 \"$HOME/code/home/tools/hex-autobuild/install.py\" \"${HIVEMIND_LAND_HEAD:0:8}\" \"$PWD/target/app/Agent-Desk.app\"; else rm -rf /Applications/Agent-Desk.app && ditto \"$PWD/target/app/Agent-Desk.app\" /Applications/Agent-Desk.app && open -g /Applications/Agent-Desk.app; fi"
stamp = "~/Library/Caches/hex-install/installed-rev"
