# Pilot (the Agent-Desk fork): website, downloads, and the update channel, served
# from /srv/pilot (docs/pilot-release.md). Installed as
# /etc/caddy/caddy-ai-sms-pilot.conf and imported by
# /etc/caddy/caddy-static-sites.conf; self-contained (inline TLS), like the
# other static sites.
ai.sms-pilot.de {
	tls {
		dns cloudflare {env.CF_API_TOKEN}
	}
	root * /srv/pilot/site
	encode zstd gzip

	header {
		Strict-Transport-Security "max-age=31536000"
		X-Content-Type-Options nosniff
		Referrer-Policy strict-origin-when-cross-origin
		-Server
	}

	# The manifests the app polls: always revalidated (ETag / If-None-Match).
	handle /release/hex/desktop/* {
		root * /srv/pilot
		header Cache-Control "no-cache"
		file_server
	}

	# Content-addressed release files never change; saved under their name.
	handle /release/hex/files/* {
		root * /srv/pilot
		header Cache-Control "public, max-age=31536000, immutable"
		header Content-Disposition `attachment; filename="{file}"`
		file_server
	}

	handle /release/hex/* {
		root * /srv/pilot
		header Cache-Control "no-cache"
		file_server
	}

	# /download/<target>: the newest published file of a target (a symlink
	# pilot-publish.sh switches), saved under the target's file name.
	map {path} {pilot_download_name} {
		/download/linux-x64 hex
		/download/linux-arm64 hex
		/download/linux-x64-deb hex.deb
		/download/linux-arm64-deb hex.deb
		/download/linux-x64-rpm hex.rpm
		/download/linux-arm64-rpm hex.rpm
		/download/macos-arm64-dmg Pilot.dmg
		/download/macos-arm64 Agent-Desk.zip
		/download/windows-x64-setup PilotSetup.exe
		/download/windows-arm64-setup PilotSetup.exe
		/download/windows-x64 agent-desk.exe
		/download/windows-arm64 agent-desk.exe
		default ""
	}
	@download path_regexp ^/download/[a-z0-9-]+$
	handle @download {
		root * /srv/pilot
		header Cache-Control "no-cache"
		header Content-Disposition `attachment; filename="{pilot_download_name}"`
		file_server
	}
	handle /download/index.json {
		root * /srv/pilot
		header Cache-Control "no-cache"
		file_server
	}

	# The install scripts, readable in a browser and piped into a shell.
	@scripts path /install-linux.sh /install-windows.ps1
	handle @scripts {
		header Content-Type "text/plain; charset=utf-8"
		header Cache-Control "no-cache"
		file_server
	}

	handle /assets/* {
		header Cache-Control "public, max-age=31536000, immutable"
		file_server
	}

	handle {
		header Cache-Control "public, max-age=300"
		try_files {path} {path}/index.html
		file_server
	}
}
