# The agent-desk .deb and .rpm, built by scripts/package-linux.sh with nfpm from a
# release executable, in a directory it stages with agent-desk, fheuer.agentdesk.desktop,
# the hicolor icons, agent-desk.service, LICENSE, and the postinst/postrm scripts. They install what the AUR package hex-bin does:
# /usr/bin/agent-desk, the desktop entry, and the systemd user unit. Agent-Desk never
# replaces a package-managed executable; it shows the update command the
# release service lists for the deb-<arch> or rpm-<arch> distribution.
name: agent-desk
arch: ${AGENT_DESK_PACKAGE_ARCH}
platform: linux
version: ${AGENT_DESK_PACKAGE_VERSION}
version_schema: none
release: "1"
section: utils
priority: optional
maintainer: fheuer <pilot@ai.sms-pilot.de>
vendor: fheuer
homepage: https://ai.sms-pilot.de
license: MIT
description: |-
  Agent-Desk voice dictation: hold a key, speak, and it types.
  Local speech recognition with optional voice commands (Linux beta).
contents:
  - src: agent-desk
    dst: /usr/bin/agent-desk
    file_info:
      mode: 0755
  - src: fheuer.agentdesk.desktop
    dst: /usr/share/applications/fheuer.agentdesk.desktop
    file_info:
      mode: 0644
  - src: icons/hicolor/16x16/apps/fheuer.agentdesk.png
    dst: /usr/share/icons/hicolor/16x16/apps/fheuer.agentdesk.png
    file_info:
      mode: 0644
  - src: icons/hicolor/24x24/apps/fheuer.agentdesk.png
    dst: /usr/share/icons/hicolor/24x24/apps/fheuer.agentdesk.png
    file_info:
      mode: 0644
  - src: icons/hicolor/32x32/apps/fheuer.agentdesk.png
    dst: /usr/share/icons/hicolor/32x32/apps/fheuer.agentdesk.png
    file_info:
      mode: 0644
  - src: icons/hicolor/48x48/apps/fheuer.agentdesk.png
    dst: /usr/share/icons/hicolor/48x48/apps/fheuer.agentdesk.png
    file_info:
      mode: 0644
  - src: icons/hicolor/64x64/apps/fheuer.agentdesk.png
    dst: /usr/share/icons/hicolor/64x64/apps/fheuer.agentdesk.png
    file_info:
      mode: 0644
  - src: icons/hicolor/128x128/apps/fheuer.agentdesk.png
    dst: /usr/share/icons/hicolor/128x128/apps/fheuer.agentdesk.png
    file_info:
      mode: 0644
  - src: icons/hicolor/256x256/apps/fheuer.agentdesk.png
    dst: /usr/share/icons/hicolor/256x256/apps/fheuer.agentdesk.png
    file_info:
      mode: 0644
  - src: icons/hicolor/512x512/apps/fheuer.agentdesk.png
    dst: /usr/share/icons/hicolor/512x512/apps/fheuer.agentdesk.png
    file_info:
      mode: 0644
  - src: agent-desk.service
    dst: /usr/lib/systemd/user/agent-desk.service
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/licenses/agent-desk/LICENSE
    file_info:
      mode: 0644
scripts:
  postinstall: refresh-desktop.sh
  postremove: refresh-desktop.sh
overrides:
  # Linked, then loaded at runtime: the X11, Wayland, and xkbcommon client
  # libraries. The floor is Debian 12's glibc 2.36 and GCC 12 libstdc++
  # (packaging/linux/build.Dockerfile). Ubuntu 24.04 renamed alsa and
  # OpenSSL for its 64-bit time_t transition, so each takes either name.
  deb:
    depends:
      - libc6 (>= 2.36)
      - libgcc-s1
      - libstdc++6 (>= 12)
      - libasound2t64 | libasound2
      - libssl3t64 | libssl3
      - libvulkan1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libx11-6
      - libxcb1
      - libxcursor1
      - libxi6
      - libwayland-client0
      - curl
    recommends:
      - mesa-vulkan-drivers
      - wl-clipboard
      - wtype
      - xdg-utils
  # Library names, so Fedora and openSUSE resolve them to their own packages.
  rpm:
    depends:
      - libasound.so.2()(64bit)
      - libssl.so.3()(64bit)
      - libvulkan.so.1()(64bit)
      - libxkbcommon.so.0()(64bit)
      - libxkbcommon-x11.so.0()(64bit)
      - libX11.so.6()(64bit)
      - libxcb.so.1()(64bit)
      - libXcursor.so.1()(64bit)
      - libXi.so.6()(64bit)
      - libwayland-client.so.0()(64bit)
      - curl
    recommends:
      - wl-clipboard
      - wtype
      - xdg-utils
rpm:
  group: Applications/Productivity
  summary: Agent-Desk voice dictation by Anomaly
